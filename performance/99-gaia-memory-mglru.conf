# ==============================================================================
# Gaia OS Ivy Bridge Edition — memória para desktop 16 GiB (i7-3770)
# zRAM zstd de 25% da RAM (zram-tools), não os 6 GiB da edição Westmere.
# page-cluster=0 continua correto: zRAM é acesso aleatório, não disco.
# ==============================================================================

vm.page-cluster = 0
vm.swappiness = 60
vm.vfs_cache_pressure = 50

# SSD SATA: escrita suja curta para não travar o desktop
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
vm.dirty_expire_centisecs = 1500

vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 100
vm.compaction_proactiveness = 20
# ~128 MiB livres em 16 GiB, o bastante para rajadas sem reservar RAM demais
vm.min_free_kbytes = 131072
