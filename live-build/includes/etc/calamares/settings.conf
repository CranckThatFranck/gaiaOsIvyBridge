# Instalador da Gaia OS Ivy Bridge Edition.
# Sequência baseada no calamares-settings-debian 13 (Trixie), com marca Gaia,
# layout EFI 600 MiB + /boot 1 GiB + raiz, e gaia-postinstall no alvo.
---
modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
prompt-install: false
dont-chroot: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - packages
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - shellprocess
  - umount
- show:
  - finished

branding: gaiaos
