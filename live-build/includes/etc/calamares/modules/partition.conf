---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 600MiB
  minimumSize: 300MiB
  label: "GAIAEFI"

userSwapChoices:
  - none
initialSwapChoice: none
initialPartitioningChoice: none
defaultFileSystemType: "ext4"
defaultPartitionTableType: gpt
drawNestedPartitions: false
alwaysShowPartitionLabels: true
luksGeneration: luks1

partitionLayout:
  - name: "GAIABOOT"
    filesystem: "ext4"
    mountPoint: "/boot"
    size: 1024M
    minSize: 1024M
    maxSize: 1024M
    noEncrypt: true
  - name: "GAIAROOT"
    filesystem: "ext4"
    mountPoint: "/"
    size: 100%
