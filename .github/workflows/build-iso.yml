name: ISO Gaia OS Ivy Bridge

on:
  workflow_dispatch:
  push:
    tags:
      - "ivybridge-v*"

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          sudo apt-get clean
          df -h

      - name: Construir a ISO
        run: ./scripts/build-iso.sh

      - name: Dividir se passar do limite de 2 GiB do GitHub
        run: |
          set -euo pipefail
          iso=dist/gaiaos-ivybridge-1.0-amd64.iso
          size=$(stat -c%s "$iso")
          echo "Tamanho: $size"
          if [ "$size" -gt 1900000000 ]; then
            split -b 1500M -d -a 2 "$iso" "${iso}.part"
            rm -f "$iso"
            printf '%s\n' \
              "A ISO passou de 2 GiB e foi publicada em pedaços." \
              "Baixe todos os .part e o .sha256 e execute:" \
              "  cat gaiaos-ivybridge-1.0-amd64.iso.part* > gaiaos-ivybridge-1.0-amd64.iso" \
              "  sha256sum -c gaiaos-ivybridge-1.0-amd64.iso.sha256" \
              "Ou: ./scripts/juntar-iso.sh" \
              > dist/COMO-JUNTAR.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gaiaos-ivybridge-iso
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.iso
            dist/*.sha256
            dist/*.part*
            dist/COMO-JUNTAR.txt
            dist/VERSIONS.txt

      - name: Publicar GitHub Release
        if: startsWith(github.ref, 'refs/tags/ivybridge-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="ISO híbrida UEFI da Gaia OS Ivy Bridge Edition (${tag}).

          Debian 13 Trixie, KDE Plasma 6.3, kernel 6.12, firmware-realtek e intel-microcode.
          Sessão live: usuário gaia, senha gaia, teclado ABNT2, America/Sao_Paulo.
          Instalação e gravação do pendrive: docs/INSTALACAO_IVYBRIDGE.md no repositório.

          Confira o SHA256 em gaiaos-ivybridge-1.0-amd64.iso.sha256.
          Se só houver arquivos .part, junte com scripts/juntar-iso.sh antes de gravar."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "Gaia OS Ivy Bridge Edition ${tag}" --notes "$notes"
          fi
